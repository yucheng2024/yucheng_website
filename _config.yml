# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Yucheng Xie
description: "Yucheng Xie is an Assistant Professor at Yeshiva University researching smart healthcare, wireless sensing, and AI security and privacy."
url: "https://www.yuchengxie.com"
email: yucheng.xie@yu.edu
twitter_username: username
github_username: username
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# include:
#   - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Yucheng Xie"
  avatar : "/assets/images/5A9A5FAC-C9FD-42A5-A5C8-B096437F237D_1_201_a.jpeg"
  bio    : "Assistant Professor<br>Department of Graduate Computer Science and Engineering<br>Katz School of Science and Health<br>Yeshiva University"
  links:
    - label: "Official Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.yu.edu/faculty/pages/xie-yucheng"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google"
      url: "https://scholar.google.com/citations?user=R5OVHC0AAAAJ&hl=en"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0001-5830-6625"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/yucheng-xie-083763142/"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:yucheng.xie@yu.edu"
    - label: "Office Location"
      icon: "fas fa-fw fa-map-marker-alt"
      url: "https://www.google.com/maps/search/?api=1&query=205+Lexington+Ave+7th+floor+Room+714+Manhattan+New+York+NY+10016"


